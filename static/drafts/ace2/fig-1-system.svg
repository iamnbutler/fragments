<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none" stroke="#000" stroke-width="2" font-family="Georgia, 'Times New Roman', serif">
  <title>Fig. 1. Ace: hosts, channels and team-deployed services</title>
  <style>
    text { fill: #000; stroke: none; font-size: 15px; }
    .num { font-size: 17px; font-style: italic; }
    .cap { font-size: 20px; letter-spacing: 2px; }
    .thin { stroke-width: 1.25; }
    .dash { stroke-dasharray: 8 6; }
    .dot { stroke-dasharray: 2 5; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" stroke="#000" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- tailnet boundary 10 -->
  <path class="dash" d="M40 160 C40 110 80 90 140 90 L600 90 C660 90 690 120 690 170 L690 560 C690 610 660 630 600 630 L140 630 C80 630 40 610 40 560 Z"/>

  <!-- host A 12 -->
  <rect x="80" y="130" width="330" height="300" rx="6"/>
  <rect x="80" y="130" width="330" height="34" rx="6"/>
  <circle cx="98" cy="147" r="5" class="thin"/><circle cx="116" cy="147" r="5" class="thin"/><circle cx="134" cy="147" r="5" class="thin"/>
  <!-- gateway 14 -->
  <rect x="300" y="186" width="90" height="40" class="thin"/>
    <!-- three channel workers 16, each with cylinder 18 and lane fork 20 -->
  <g class="thin">
    <rect x="104" y="250" width="80" height="46"/>
    <rect x="204" y="250" width="80" height="46"/>
    <rect x="304" y="250" width="80" height="46" class="dash"/>
    <path d="M144 250 L144 236 L344 236 L344 250 M244 236 L244 250 M244 236 L344 236 M345 226 L345 236"/>
    <!-- sqlite cylinders -->
    <path d="M124 330 a20 7 0 0 0 40 0 a20 7 0 0 0 -40 0 v34 a20 7 0 0 0 40 0 v-34"/>
    <path d="M224 330 a20 7 0 0 0 40 0 a20 7 0 0 0 -40 0 v34 a20 7 0 0 0 40 0 v-34"/>
    <path d="M324 330 a20 7 0 0 0 40 0 a20 7 0 0 0 -40 0 v34 a20 7 0 0 0 40 0 v-34"/>
    <path d="M144 296 L144 323 M244 296 L244 323 M344 296 L344 323" class="dot"/>
    <!-- lane worktrees: forked branches -->
    <path d="M110 405 L180 405 M130 405 C140 405 140 392 156 392 L176 392 M130 405 C140 405 140 418 156 418 L176 418"/>
    <circle cx="110" cy="405" r="3"/><circle cx="176" cy="392" r="3"/><circle cx="176" cy="418" r="3"/>
  </g>

  <!-- host B 22 -->
  <rect x="460" y="150" width="190" height="150" rx="6"/>
  <rect x="460" y="150" width="190" height="30" rx="6"/>
  <rect x="490" y="210" width="60" height="36" class="thin"/>
  <rect x="566" y="210" width="60" height="36" class="thin"/>
  <!-- phone 24 -->
  <rect x="470" y="470" width="78" height="140" rx="12"/>
  <rect x="480" y="488" width="58" height="96" class="thin"/>
  <circle cx="509" cy="596" r="5" class="thin"/>

  <!-- tailnet links -->
  <path class="thin" d="M390 206 C430 206 440 230 460 230" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="thin" d="M345 226 C360 380 420 520 470 530" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- team cloud account 26 -->
  <rect x="726" y="200" width="218" height="290" rx="10" class="dash"/>
  <path d="M800 186 c0 -16 16 -26 32 -21 c6 -16 38 -16 46 0 c16 -2 28 10 24 24 c10 8 6 22 -8 22 l-86 0 c-16 0 -20 -18 -8 -25 Z" class="thin"/>
  <rect x="750" y="260" width="170" height="70" rx="4"/>
  <rect x="750" y="370" width="170" height="90" rx="4"/>
  <path class="thin" d="M770 400 a14 5 0 0 0 28 0 a14 5 0 0 0 -28 0 v24 a14 5 0 0 0 28 0 v-24"/>

  <!-- hosted channel dials out to workspace (host A) -->
  <path d="M750 430 C640 440 520 360 410 340" marker-start="url(#a)" class="thin"/>
  <!-- every host publishes to directory -->
  <path class="thin dot" d="M410 160 C540 60 700 120 760 270" marker-end="url(#a)"/>
  <path class="thin dot" d="M650 200 C700 210 720 240 760 270" marker-end="url(#a)"/>

  <!-- reference numerals with leader lines -->
  <g class="thin">
    <path d="M58 120 L30 70"/>     <text class="num" x="18" y="62">10</text>
    <path d="M95 175 L60 200"/>    <text class="num" x="40" y="212">12</text>
    <path d="M360 192 L440 120"/>  <text class="num" x="444" y="116">14</text>
    <path d="M184 270 L225 205"/>  <text class="num" x="216" y="198">16</text>
    <path d="M124 350 L56 330"/>   <text class="num" x="34" y="334">18</text>
    <path d="M110 412 L60 470"/>   <text class="num" x="40" y="486">20</text>
    <path d="M648 190 L700 120"/>  <text class="num" x="700" y="112">22</text>
    <path d="M548 560 L590 580"/>  <text class="num" x="594" y="588">24</text>
    <path d="M726 300 L700 316"/>  <text class="num" x="678" y="334">26</text>
    <path d="M840 330 L870 350"/>  <text class="num" x="874" y="362">32</text>
    <path d="M920 455 L940 470"/>  <text class="num" x="920" y="488" dx="-4" dy="16">28</text>
    <path d="M610 404 L640 360"/>  <text class="num" x="636" y="352">30</text>
  </g>
  <text x="768" y="300">directory</text>
  <text x="808" y="420">hosted</text>
  <text x="808" y="440">channel</text>
  <text x="314" y="211" font-size="13">gateway</text>
  <text x="200" y="152" font-size="13">host</text>
  <text x="530" y="171" font-size="13">teammate</text>

  <text class="cap" x="40" y="664">FIG. 1</text>
  <text x="130" y="660" font-size="13">10 tailnet: the team · 12 host · 14 gateway · 16 channel worker, one process per channel (dashed: dormant)</text>
  <text x="130" y="680" font-size="13">18 channel.sqlite · 20 lanes (git worktrees) · 22 teammate's host · 24 phone, over the tailnet</text>
  <text x="130" y="700" font-size="13">26 team's cloud account · 28 hosted channel (durable object) · 30 workspace link, dialed out · 32 directory</text>
</svg>
