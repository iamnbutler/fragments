<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" stroke="#000" stroke-width="2" font-family="Georgia, 'Times New Roman', serif">
  <title>Fig. 1. desktop-tools: who holds the permission</title>
  <style>
    text { fill: #000; stroke: none; font-size: 15px; }
    .num { font-size: 17px; font-style: italic; }
    .cap { font-size: 20px; letter-spacing: 2px; }
    .small { font-size: 13px; }
    .thin { stroke-width: 1.25; }
    .dash { stroke-dasharray: 8 6; }
    .dot { stroke-dasharray: 2 5; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" stroke="#000" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- 40 node/bun host process -->
  <rect x="40" y="200" width="170" height="170" rx="4"/>
  <text x="58" y="230">host process</text>
  <text x="58" y="250" class="small">Node or Bun</text>
  <rect x="58" y="280" width="134" height="60" class="thin"/>
  <text x="68" y="306" class="small">createDesktop()</text>
  <text x="68" y="326" class="small">{ op: "inspect" }</text>

  <!-- 42 signed client -->
  <rect x="280" y="236" width="140" height="98" rx="4"/>
  <text x="296" y="264">signed client</text>
  <text x="296" y="284" class="small">desktop-tools-client</text>
  <!-- seal: signing identity -->
  <circle cx="392" cy="312" r="14" class="thin"/>
  <path class="thin" d="M384 312 l6 6 l10 -12"/>
  <path class="thin" d="M384 324 l-4 14 l8 -5 l4 8 l2 -14"/>
  <path class="thin" d="M210 285 L280 285" marker-end="url(#a)"/>
  <text x="222" y="276" class="small">spawn</text>

  <!-- 44 unix socket: a plug and receptacle -->
  <path d="M420 285 L470 285"/>
  <rect x="470" y="270" width="26" height="30" class="thin"/>
  <path class="thin" d="M496 278 L506 278 M496 292 L506 292"/>
  <rect x="510" y="266" width="22" height="38" class="thin"/>
  <path d="M532 285 L560 285"/>

  <!-- 46 embedding GUI app -->
  <rect x="560" y="110" width="360" height="360" rx="14"/>
  <rect x="560" y="110" width="360" height="36" rx="14"/>
  <circle cx="580" cy="128" r="5" class="thin"/><circle cx="598" cy="128" r="5" class="thin"/><circle cx="616" cy="128" r="5" class="thin"/>
  <text x="680" y="134">embedding app (signed)</text>

  <!-- 48 dylib runtime -->
  <rect x="590" y="176" width="300" height="150" rx="4"/>
  <text x="606" y="204">libDesktopTools.dylib</text>
  <text x="606" y="224" class="small">patched Peekaboo Bridge</text>
  <!-- 50 patch stack glyph -->
  <g class="thin">
    <path d="M770 250 l90 0 l0 50 l-90 0 Z"/>
    <path d="M776 244 l90 0 l0 50"/>
    <path d="M782 238 l90 0 l0 50"/>
  </g>
  <text x="606" y="262" class="small">C ABI:</text>
  <text x="606" y="282" class="small">desktop_tools_start</text>
  <text x="606" y="300" class="small">desktop_tools_status</text>
  <text x="606" y="318" class="small">desktop_tools_stop</text>

  <!-- 52 three permission keys -->
  <g class="thin">
    <circle cx="616" cy="388" r="12"/><path d="M628 388 L672 388 M660 388 l0 10 M668 388 l0 8"/>
    <circle cx="616" cy="424" r="12"/><path d="M628 424 L672 424 M660 424 l0 10 M668 424 l0 8"/>
    <circle cx="616" cy="452" r="8"/><path d="M624 452 L660 452 M652 452 l0 8"/>
  </g>
  <text x="690" y="393" class="small">Accessibility</text>
  <text x="690" y="429" class="small">Screen Recording</text>
  <text x="690" y="457" class="small">Event Synthesizing</text>

  <!-- 54 target application window being operated -->
  <rect x="610" y="520" width="250" height="90" rx="6" class="dash"/>
  <text x="626" y="572" class="small">any other app's window</text>
  <path class="thin" d="M740 470 L740 520" marker-end="url(#a)"/>

  <!-- identity checks across socket -->
  <path class="thin dot" d="M392 236 C420 160 520 160 560 190" marker-end="url(#a)"/>
  <path class="thin dot" d="M560 360 C520 400 430 390 392 340" marker-end="url(#a)"/>
  <text x="404" y="168" class="small">client checks host's team</text>
  <text x="380" y="410" class="small">host accepts exact client identifier</text>

  <!-- reference numerals -->
  <g class="thin">
    <path d="M60 200 L40 160"/> <text class="num" x="26" y="152">40</text>
    <path d="M330 236 L310 190"/> <text class="num" x="296" y="184">42</text>
    <path d="M500 300 L500 340"/> <text class="num" x="488" y="360">44</text>
    <path d="M920 140 L944 110"/> <text class="num" x="930" y="102">46</text>
    <path d="M890 200 L930 220"/> <text class="num" x="932" y="236">48</text>
    <path d="M872 270 L930 300"/> <text class="num" x="932" y="316">50</text>
    <path d="M600 410 L572 500"/> <text class="num" x="552" y="516">52</text>
    <path d="M860 560 L900 580"/> <text class="num" x="904" y="590">54</text>
  </g>

  <text class="cap" x="40" y="580">FIG. 1</text>
  <text x="40" y="604" class="small">40 host process · 42 signed client · 44 Unix socket · 46 embedding GUI app</text>
  <text x="40" y="622" class="small">48 native runtime · 50 ordered patch stack · 52 macOS grants, held by 46 · 54 target window</text>
</svg>
