<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none" stroke="#000" stroke-width="2" font-family="Georgia, 'Times New Roman', serif">
  <title>Fig. 2. Observe, act once, observe again</title>
  <style>
    text { fill: #000; stroke: none; font-size: 15px; }
    .num { font-size: 17px; font-style: italic; }
    .cap { font-size: 20px; letter-spacing: 2px; }
    .small { font-size: 13px; }
    .big { font-size: 22px; }
    .thin { stroke-width: 1.25; }
    .dash { stroke-dasharray: 8 6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" stroke="#000" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- step 1: inspect (eye over window) -->
  <rect x="60" y="80" width="200" height="140" rx="6"/>
  <path class="thin" d="M60 104 L260 104"/>
  <path d="M110 162 C130 136 190 136 210 162 C190 188 130 188 110 162 Z"/>
  <circle cx="160" cy="162" r="13"/>
  <circle cx="160" cy="162" r="4" fill="#000"/>
  <text class="big" x="110" y="40">1  inspect</text>
  <text class="small" x="60" y="244">accessibility text + screenshot</text>

  <!-- step 2: snapshot ticket (single-use) -->
  <path d="M370 110 L560 110 L560 140 a12 12 0 0 0 0 24 L560 194 L370 194 L370 164 a12 12 0 0 0 0 -24 Z"/>
  <path class="thin dash" d="M410 110 L410 194"/>
  <text x="424" y="146">snapshot_id</text>
  <text class="small" x="424" y="170">process · window · controls</text>
  <text class="big" x="370" y="40">2  snapshot</text>
  <text class="small" x="370" y="244">single use; consumed by any dispatch</text>
  <path class="thin" d="M260 150 L366 150" marker-end="url(#a)"/>

  <!-- step 3: act once (pointing hand / cursor) -->
  <path d="M720 110 L720 190 L740 172 L754 202 L766 196 L752 167 L778 166 Z"/>
  <circle cx="720" cy="110" r="22" class="thin dash"/>
  <text class="big" x="680" y="40">3  act once</text>
  <text class="small" x="680" y="244">click, type, key, drag, insert…</text>
  <path class="thin" d="M560 150 L676 150" marker-end="url(#a)"/>

  <!-- step 4: three-way outcome -->
  <path d="M740 262 L740 300"/>
  <path d="M480 300 L860 300"/>
  <path class="thin" d="M480 300 L480 340" marker-end="url(#a)"/>
  <path class="thin" d="M670 300 L670 340" marker-end="url(#a)"/>
  <path class="thin" d="M860 300 L860 340" marker-end="url(#a)"/>
  <rect x="410" y="344" width="140" height="56"/>
  <rect x="600" y="344" width="140" height="56"/>
  <rect x="790" y="344" width="140" height="56" class="dash"/>
  <text x="440" y="378">completed</text>
  <text x="640" y="378">refused</text>
  <text x="826" y="378">unknown</text>
  <text class="small" x="410" y="424">native op returned;</text>
  <text class="small" x="410" y="442">verify the effect</text>
  <text class="small" x="600" y="424">never dispatched</text>
  <text class="small" x="600" y="442">(stale, no permission)</text>
  <text class="small" x="790" y="424">may have landed;</text>
  <text class="small" x="790" y="442">never replayed</text>

  <!-- back to inspect -->
  <path d="M480 470 L480 500 L36 500 L36 190" class="thin"/>
  <path d="M670 470 L670 500 L480 500" class="thin"/>
  <path d="M860 470 L860 500 L670 500" class="thin"/>
  <path d="M36 200 L36 170 L56 170" class="thin" marker-end="url(#a)"/>
  <text class="small" x="60" y="492">every path returns to 1</text>

  <!-- numerals -->
  <g class="thin">
    <path d="M100 80 L84 50"/><text class="num" x="20" y="46" dx="44">60</text>
    <path d="M560 112 L590 90"/><text class="num" x="592" y="86">62</text>
    <path d="M766 196 L800 214"/><text class="num" x="804" y="222">64</text>
    <path d="M410 372 L380 372"/><text class="num" x="356" y="378">66</text>
  </g>

  <text class="cap" x="60" y="560">FIG. 2</text>
  <text class="small" x="150" y="557">60 passive observation, never activates the window · 62 snapshot bound to exact target</text>
  <text class="small" x="150" y="576">64 one background-delivered action · 66 outcome recorded by the host; an uncertain action is not retried</text>
</svg>
