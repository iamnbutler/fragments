<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" fill="none" stroke="#000" stroke-width="2" font-family="Georgia, 'Times New Roman', serif">
  <title>Fig. 3. Fifteen ordered patches on a pinned Peekaboo</title>
  <style>
    text { fill: #000; stroke: none; font-size: 14px; }
    .num { font-size: 17px; font-style: italic; }
    .cap { font-size: 20px; letter-spacing: 2px; }
    .small { font-size: 13px; }
    .thin { stroke-width: 1.25; }
    .dash { stroke-dasharray: 8 6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" stroke="#000" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- base block: pinned upstream -->
  <path d="M120 470 L520 470 L560 440 L160 440 Z"/>
  <path d="M120 470 L120 520 L520 520 L520 470 M520 520 L560 490 L560 440"/>
  <text x="170" y="502">Peekaboo 4.8.0 · pinned revision 4d43dc9</text>

  <!-- 15 sheets, in apply order bottom to top -->
  <g class="thin">
    <path d="M140 430 L520 430 L556 404 L176 404 Z"/>
    <path d="M140 406 L520 406 L556 380 L176 380 Z"/>
    <path d="M140 382 L520 382 L556 356 L176 356 Z"/>
    <path d="M140 358 L520 358 L556 332 L176 332 Z"/>
    <path d="M140 334 L520 334 L556 308 L176 308 Z"/>
    <path d="M140 310 L520 310 L556 284 L176 284 Z"/>
    <path d="M140 286 L520 286 L556 260 L176 260 Z"/>
    <path d="M140 262 L520 262 L556 236 L176 236 Z"/>
    <path d="M140 238 L520 238 L556 212 L176 212 Z"/>
    <path d="M140 214 L520 214 L556 188 L176 188 Z"/>
    <path class="dash" d="M140 190 L520 190 L556 164 L176 164 Z"/>
    <path class="dash" d="M140 166 L520 166 L556 140 L176 140 Z"/>
    <path class="dash" d="M140 142 L520 142 L556 116 L176 116 Z"/>
    <path class="dash" d="M140 118 L520 118 L556 92 L176 92 Z"/>
    <path class="dash" d="M140 94 L520 94 L556 68 L176 68 Z"/>
  </g>

  <!-- ordered labels, right-hand column with leaders (order from src/build.ts) -->
  <g class="small">
    <text x="640" y="426">01  click</text>
    <text x="640" y="402">02  insert</text>
    <text x="640" y="378">03  pointer-window</text>
    <text x="640" y="354">04  quit</text>
    <text x="640" y="330">05  clipboard-text</text>
    <text x="640" y="306">06  close</text>
    <text x="640" y="282">07  clipboard-image</text>
    <text x="640" y="258">08  launch</text>
    <text x="640" y="234">09  clipboard-files</text>
    <text x="640" y="210">10  point-focus</text>
    <text x="640" y="186">11  clipboard-image-write</text>
    <text x="640" y="162">12  open</text>
    <text x="640" y="138">13  menu</text>
    <text x="640" y="114">14  clipboard-files-write</text>
    <text x="640" y="90">15  stale-click</text>
  </g>
  <g class="thin">
    <path d="M556 417 L632 421"/>
    <path d="M556 81 L632 86"/>
  </g>

  <!-- bracket: complete prefix already in checkout -->
  <path class="thin" d="M110 430 L96 430 L96 192 L110 192"/>
  <text x="20" y="300" class="small">already</text>
  <text x="20" y="318" class="small">applied</text>
  <text x="20" y="336" class="small">(prefix)</text>
  <path class="thin" d="M110 190 L96 190 L96 70 L110 70"/>
  <text x="20" y="124" class="small">apply only</text>
  <text x="20" y="142" class="small">the missing</text>
  <text x="20" y="160" class="small">suffix</text>

  <!-- verification gate -->
  <path class="thin" d="M340 60 L340 30 L760 30" marker-end="url(#a)"/>
  <rect x="764" y="12" width="170" height="40"/>
  <text x="778" y="37">verify, then compile</text>
  <text x="600" y="560" class="small">source drifted from every complete prefix → build fails</text>

  <text class="cap" x="40" y="590">FIG. 3</text>
  <text class="small" x="130" y="588">Patch order as listed in src/build.ts; the split shown is one example. Keep new patches at the end so an existing stack stays a valid prefix.</text>
</svg>
