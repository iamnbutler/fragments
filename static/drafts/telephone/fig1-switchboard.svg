<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" stroke="#000" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>
  <g fill="#000" stroke="none">
    <text x="600" y="48" text-anchor="middle" font-size="26" letter-spacing="6">FIG. 1</text>
    <text x="600" y="76" text-anchor="middle" font-size="14" font-style="italic">Route selection for one outgoing message (Telephone 0.2)</text>
  </g>

  <!-- 10 sending agent -->
  <rect x="50" y="300" width="170" height="110"/>
  <rect x="62" y="312" width="146" height="62"/>
  <line x1="62" y1="390" x2="208" y2="390"/>
  <g fill="#000" stroke="none" font-size="15" text-anchor="middle">
    <text x="135" y="340">SENDING</text><text x="135" y="360">AGENT</text>
  </g>
  <text x="135" y="440" fill="#000" stroke="none" font-size="12" text-anchor="middle" font-style="italic">send_message / telephone send</text>
  <line x1="200" y1="300" x2="230" y2="262"/><text x="234" y="258" fill="#000" stroke="none" font-size="18">10</text>

  <!-- 12 journal (cylinder) -->
  <path d="M300 320 v70 a65 16 0 0 0 130 0 v-70"/>
  <ellipse cx="365" cy="320" rx="65" ry="16"/>
  <path d="M300 345 a65 16 0 0 0 130 0" stroke-dasharray="4 5"/>
  <g fill="#000" stroke="none" font-size="13" text-anchor="middle">
    <text x="365" y="372">JOURNAL</text>
    <text x="365" y="430" font-style="italic" font-size="12">messages.sqlite</text>
  </g>
  <line x1="420" y1="306" x2="446" y2="276"/><text x="450" y="272" fill="#000" stroke="none" font-size="18">12</text>
  <line x1="220" y1="355" x2="296" y2="355" marker-end="url(#a)"/>

  <!-- 14 route selector: switchboard jack field -->
  <rect x="500" y="250" width="170" height="210"/>
  <g>
    <circle cx="645" cy="300" r="11"/><circle cx="645" cy="300" r="4"/>
    <circle cx="645" cy="355" r="11"/><circle cx="645" cy="355" r="4"/>
    <circle cx="645" cy="410" r="11"/><circle cx="645" cy="410" r="4"/>
  </g>
  <g fill="#000" stroke="none" font-size="11.5">
    <text x="514" y="297">1. delivery:</text><text x="514" y="311">"inbox"</text>
    <text x="514" y="352">2. fresh poll</text><text x="514" y="366">evidence &lt; 15 s</text>
    <text x="514" y="407">3. otherwise</text><text x="514" y="421">native route</text>
  </g>
  <text x="585" y="490" fill="#000" stroke="none" font-size="12" text-anchor="middle" font-style="italic">first match wins</text>
  <line x1="660" y1="250" x2="690" y2="216"/><text x="694" y="212" fill="#000" stroke="none" font-size="18">14</text>
  <line x1="432" y1="355" x2="496" y2="355" marker-end="url(#a)"/>

  <!-- patch cords out of the jacks (catenary curves) -->
  <path d="M656 300 C 720 300, 720 160, 800 160" marker-end="url(#a)"/>
  <path d="M656 355 C 740 355, 720 180, 800 180" marker-end="url(#a)"/>
  <path d="M656 410 C 720 410, 730 425, 800 425" marker-end="url(#a)"/>
  <path d="M656 410 C 720 420, 690 615, 800 615" marker-end="url(#a)"/>

  <!-- 16 Telephone inbox -->
  <rect x="805" y="120" width="160" height="90"/>
  <path d="M805 140 h160"/>
  <g fill="#000" stroke="none" font-size="13" text-anchor="middle">
    <text x="885" y="134" font-size="11">PULL</text>
    <text x="885" y="168">TELEPHONE</text><text x="885" y="186">INBOX</text>
  </g>
  <line x1="955" y1="120" x2="980" y2="92"/><text x="984" y="88" fill="#000" stroke="none" font-size="18">16</text>

  <!-- 18 Claude socket -->
  <rect x="805" y="380" width="160" height="90"/>
  <circle cx="830" cy="425" r="12"/><line x1="830" y1="413" x2="830" y2="437"/>
  <g fill="#000" stroke="none" font-size="13" text-anchor="middle">
    <text x="895" y="418">CLAUDE</text><text x="895" y="436">SOCKET</text>
    <text x="885" y="492" font-size="11" font-style="italic">/tmp/cc-socks/&lt;pid&gt;.sock</text>
  </g>
  <line x1="955" y1="380" x2="980" y2="352"/><text x="984" y="348" fill="#000" stroke="none" font-size="18">18</text>

  <!-- 20 Codex queue -->
  <rect x="805" y="570" width="160" height="90"/>
  <path d="M825 590 h30 M825 600 h30 M825 610 h30 M825 620 h30"/>
  <g fill="#000" stroke="none" font-size="13" text-anchor="middle">
    <text x="905" y="610">CODEX</text><text x="905" y="628">QUEUE</text>
    <text x="885" y="682" font-size="11" font-style="italic">codex queue --thread &lt;id&gt;</text>
  </g>
  <line x1="955" y1="570" x2="980" y2="542"/><text x="984" y="538" fill="#000" stroke="none" font-size="18">20</text>

  <!-- fallback trunk: native -> inbox before bytes sent -->
  <g stroke-dasharray="7 6">
    <path d="M805 455 H 772 V 200 H 800" marker-end="url(#a)"/>
    <path d="M805 645 H 772 V 455"/>
  </g>
  <line x1="50" y1="668" x2="110" y2="668" stroke-dasharray="7 6"/>
  <text x="122" y="672" fill="#000" stroke="none" font-size="12" font-style="italic">native route falls back to the inbox only before any bytes are sent</text>

  <!-- receivers -->
  <g>
    <rect x="1050" y="140" width="110" height="60"/>
    <rect x="1050" y="395" width="110" height="60"/>
    <rect x="1050" y="585" width="110" height="60"/>
  </g>
  <g fill="#000" stroke="none" font-size="12" text-anchor="middle">
    <text x="1105" y="175">RECIPIENT</text>
    <text x="1105" y="430">CLAUDE CODE</text>
    <text x="1105" y="620">CODEX</text>
  </g>
  <path d="M1050 170 H 965" stroke-dasharray="3 5" marker-end="url(#a)"/>
  <text x="1008" y="230" fill="#000" stroke="none" font-size="11" text-anchor="middle" font-style="italic">check_inbox</text>
  <text x="1008" y="244" fill="#000" stroke="none" font-size="11" text-anchor="middle" font-style="italic">every 2 s</text>
  <path d="M965 425 H 1046" marker-end="url(#a)"/>
  <text x="1008" y="476" fill="#000" stroke="none" font-size="11" text-anchor="middle" font-style="italic">unconfirmed</text>
  <path d="M965 615 H 1046" marker-end="url(#a)"/>
  <text x="1008" y="668" fill="#000" stroke="none" font-size="11" text-anchor="middle" font-style="italic">accepted, not read</text>

  <!-- hop guard note -->
  <g fill="#000" stroke="none" font-size="12" font-style="italic">
    <text x="50" y="700">Envelope: id, conversation, reply_to, from, to, kind, body, trust = untrusted, hop_chain (max 8)</text>
  </g>
  <line x1="50" y1="715" x2="720" y2="715" stroke-width="1"/>
</svg>
