<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1 L9 5 L0 9" stroke="#000" stroke-width="1.5" fill="none"/>
    </marker>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="1.2"/>
    </pattern>
  </defs>
  <g fill="#000" stroke="none">
    <text x="600" y="48" text-anchor="middle" font-size="26" letter-spacing="6">FIG. 2</text>
    <text x="600" y="76" text-anchor="middle" font-size="14" font-style="italic">The fifteen-second window: each inbox check advertises polling, and routing follows the evidence</text>
  </g>
  <!-- time axis: 0..60s, x 100..1100 => 16.67px/s -->
  <line x1="100" y1="300" x2="1110" y2="300" marker-end="url(#a)"/>
  <g stroke-width="1.5">
    <line x1="100" y1="294" x2="100" y2="306"/><line x1="267" y1="294" x2="267" y2="306"/>
    <line x1="433" y1="294" x2="433" y2="306"/><line x1="600" y1="294" x2="600" y2="306"/>
    <line x1="767" y1="294" x2="767" y2="306"/><line x1="933" y1="294" x2="933" y2="306"/>
  </g>
  <g fill="#000" stroke="none" font-size="13" text-anchor="middle">
    <text x="100" y="326">0 s</text><text x="267" y="326">10</text><text x="433" y="326">20</text>
    <text x="600" y="326">30</text><text x="767" y="326">40</text><text x="933" y="326">50</text>
    <text x="1110" y="326">t</text>
  </g>
  <!-- inbox checks at 0,2,4,6,8 (recipient polling) -->
  <g>
    <line x1="100" y1="300" x2="100" y2="180"/><line x1="133" y1="300" x2="133" y2="180"/>
    <line x1="167" y1="300" x2="167" y2="180"/><line x1="200" y1="300" x2="200" y2="180"/>
    <line x1="233" y1="300" x2="233" y2="180"/>
    <circle cx="100" cy="176" r="4"/><circle cx="133" cy="176" r="4"/><circle cx="167" cy="176" r="4"/>
    <circle cx="200" cy="176" r="4"/><circle cx="233" cy="176" r="4"/>
  </g>
  <text x="166" y="160" fill="#000" stroke="none" font-size="12.5" text-anchor="middle" font-style="italic">recipient checks inbox every 2 s</text>
  <!-- window band from 0 to 8+15=23s => x 100..483 -->
  <rect x="100" y="230" width="383" height="50" fill="url(#h)"/>
  <rect x="100" y="230" width="383" height="50"/>
  <g fill="#000" stroke="none" font-size="12.5" text-anchor="middle">
    <text x="345" y="222">evidence fresh: new messages route to INBOX</text>
  </g>
  <!-- last check renews 15 s -->
  <path d="M233 260 H 480" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="390" y="352" fill="#000" stroke="none" font-size="12" text-anchor="middle" font-style="italic">last check + 15 s</text>
  <line x1="483" y1="200" x2="483" y2="390" stroke-dasharray="6 5"/>
  <text x="490" y="404" fill="#000" stroke="none" font-size="12" font-style="italic">expiry</text>
  <!-- native region -->
  <rect x="483" y="230" width="610" height="50"/>
  <text x="788" y="222" fill="#000" stroke="none" font-size="12.5" text-anchor="middle">evidence stale: new messages route NATIVE (Claude socket / Codex queue)</text>
  <!-- sends -->
  <g>
    <path d="M300 400 V 286" marker-end="url(#a)"/>
    <path d="M700 400 V 286" marker-end="url(#a)"/>
  </g>
  <g fill="#000" stroke="none" font-size="12.5" text-anchor="middle">
    <text x="300" y="420">send A → inbox</text>
    <text x="700" y="420">send B → native</text>
  </g>
  <text x="600" y="500" fill="#000" stroke="none" font-size="12" text-anchor="middle" font-style="italic">Expiry changes routing for new messages only. Nothing already sent is moved, resent or copied.</text>
</svg>
